services:
  postgres:
    image: postgres:16
    container_name: bank-db
    environment:
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bank-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: